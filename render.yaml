# Render Blueprint: Render 대시보드 → New → Blueprint 에서 이 저장소를 선택하면 자동 설정됩니다.
services:
  - type: web
    name: clinic-review
    runtime: node
    region: singapore        # 한국에서 가장 가까운 Render 리전
    plan: starter            # 영구 디스크는 유료 플랜에서만 가능 (요금은 Render에서 확인)
    buildCommand: echo "no build"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false          # 배포 시 직접 입력하세요 (코드에 저장되지 않음)
      - key: SESSION_SECRET
        generateValue: true  # 자동으로 긴 랜덤 값 생성
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # 선택: 새 후기 텔레그램 알림 (BotFather에서 발급)
      - key: TELEGRAM_CHAT_ID
        sync: false          # 선택: 알림 받을 직원방 ID
      - key: STAFF_PASSWORD
        sync: false          # 한약 진행 관리(/herb) 직원 공용 비밀번호 (비우면 ADMIN_PASSWORD 사용)
      - key: SOLAPI_API_KEY
        sync: false          # 알림톡(솔라피). 템플릿·설정은 templates/알림톡_템플릿_및_수신동의.md
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_PFID
        sync: false
      - key: SOLAPI_FROM
        sync: false          # 발신번호 (문자 대체발송)
      - key: ALIMTALK_TPL_SHIPPED
        sync: false          # 승인된 '한약 발송 안내' 템플릿 ID
      - key: CLINIC_NAME
        sync: false          # 화면에 표시할 한의원 이름 (배포 시 입력)
      - key: DATA_DIR
        value: /var/data
    disk:
      name: review-data
      mountPath: /var/data   # 후기 데이터(reviews.json)가 여기에 저장되어 재배포해도 유지됩니다
      sizeGB: 1
